services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartlib
      POSTGRES_USER: smartlib
      POSTGRES_PASSWORD: smartlib
    ports: ["5432:5432"]
    volumes: ["smartlib-postgres:/var/lib/postgresql/data", "./database:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      APP_MODE: mock
      CORS_ORIGINS: http://localhost:3001
      AI_SERVICE_URL: http://ai-service:8001
    ports: ["8000:8000"]
    depends_on: [postgres, redis, ai-service]
  ai-service:
    build: ./ai-service
    environment:
      AI_MODE: real
      PERSON_MODEL: /models/person.pt
      SEAT_MODEL: /models/chair.pt
      FALLBACK_MODEL: /models/yolo11n.pt
      SEAT_CONFIG: /config/cameras.example.json
      TOTAL_SEATS: 70
      TILE_INFERENCE: "true"
      TILE_OVERLAP: "0.15"
      GENERIC_SEAT_FALLBACK: "true"
      GENERIC_CONFIDENCE: "0.2"
      GENERIC_INFERENCE_SIZE: 1280
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      VIDEO_SOURCE: ${VIDEO_SOURCE:-0}
      CAMERA_STREAM_URL: ${CAMERA_STREAM_URL:-}
      CAMERA_HOST: ${CAMERA_HOST:-}
      CAMERA_PORT: ${CAMERA_PORT:-80}
      CAMERA_PROTOCOL: ${CAMERA_PROTOCOL:-http}
      CAMERA_STREAM_PATH: ${CAMERA_STREAM_PATH:-/cgi-bin/mjpg/video.cgi}
      CAMERA_USERNAME: ${CAMERA_USERNAME:-}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:-}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-chair-occupancy-detection-2/3}
      ROBOFLOW_WORKSPACE: ${ROBOFLOW_WORKSPACE:-khushi-kathuria}
      ROBOFLOW_WORKFLOW_ID: ${ROBOFLOW_WORKFLOW_ID:-general-segmentation-api-3}
      ROBOFLOW_WORKFLOW_PARAMETERS: ${ROBOFLOW_WORKFLOW_PARAMETERS:-'{"classes":["person","chair","seat","object"]}'}
    volumes:
      - ./ai-service/runs/smartlib-person-smoke/weights/best.pt:/models/person.pt:ro
      - ./ai-service/runs/smartlib-seat-states/weights/best.pt:/models/chair.pt:ro
      - ./yolo11n.pt:/models/yolo11n.pt:ro
      - ./config/cameras.example.json:/config/cameras.example.json:ro
    ports: ["127.0.0.1:8001:8001"]
  frontend:
    build: ./frontend
    ports: ["3001:3001"]
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8001
    depends_on: [backend]
volumes:
  smartlib-postgres:
